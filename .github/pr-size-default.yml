# Org-wide default: only oversized PRs get labeled. Everything else stays unlabeled.

# To exclude certain files from the line count, uncomment and edit:
exclude_files:
   - "*.lock"
   - "package-lock.json"
#   - "*.min.js"

# Only PRs over 2200 changed lines get flagged. Everything else gets a benign "valid" label.
# cbrgm matches first entry where changes <= diff; if a PR exceeds all, the LAST entry is used as catch-all.

label_configs:
  - size: v
    diff: 2200
    files: 100000
    labels: ["size/ok"]
  - size: iv
    diff: 100000000
    files: 100000000
    labels: ["size/invalid", "splitting-wanted"]
